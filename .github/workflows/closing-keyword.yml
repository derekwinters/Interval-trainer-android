# ai-sdlc: derekwinters/ai-sdlc@v0.4.22 hash=265ed1c25e6d903b
# Managed by `adopt`. Local edits are preserved but stop this file
# being updated — `adopt verify` will report it.
name: closing-keyword

# A caller. The logic is in ai-sdlc; this exists because a trigger
# cannot be centralised — it must be declared in the repository it
# fires for.
#
# Pinned to a commit rather than a tag: a tag can move, and this runs
# with this repository's token. Upgrade with `adopt apply <version>`,
# which rewrites both the SHA and the comment.
#
# Nothing is checked out here. The action is fetched by the runner,
# outside this repository's workspace.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read

jobs:
  closing-keyword:
    # A release-please release pull request aggregates many already-closed issues into one
    # changelog body and never itself closes anything new, so its body can only ever carry a
    # compare-log bullet's markdown-linked `closes [#n](...)`, never the plain `closes #n` /
    # `fixes #n` / `resolves #n` the shared action's pattern matches — this job cannot pass on
    # one. release-please-action labels its own release pull requests `autorelease: pending` from
    # the moment it opens or updates them, so that label is a reliable, structural stand-in for
    # applying this repository's `no-closing-keyword` label by hand, which is what every release
    # needed until now (#92, #116, docs/spec/build.md BUILD-045). This is a local addition to this
    # caller workflow, not a change to the shared action itself, which lives in `derekwinters/ai-sdlc`
    # and is out of this repository's reach.
    if: "${{ !contains(github.event.pull_request.labels.*.name, 'autorelease: pending') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: derekwinters/ai-sdlc/.github/actions/closing-keyword@cde337066fdce3b688d2f9cd83a992f048278784 # v0.4.22
