name: release-please

# Versioning is release-please's, derived from Conventional Commits on main.
# The VERSION_NAME line in /gradle.properties and the manifest are rewritten by
# it and by nothing else (docs/spec/build.md BUILD-013). VERSION_CODE has no
# release-please marker of its own to carry — its generic updater only
# substitutes pieces of the semver value it computed, never a freestanding
# counter — so the "Bump VERSION_CODE" step below rewrites it on the release
# pull request instead (BUILD-015).
#
# build-and-attach builds the versioned release APK and attaches it to the release in this same
# run (BUILD-050-058). A separate tag-triggered workflow would never fire: release-please pushes
# its tag with the default GITHUB_TOKEN, and GitHub does not start workflow runs from events that
# token itself initiated — and even if it did, that run would execute the workflow file frozen at
# the tag, not whatever is on main today.
#
# A push that leaves nothing for release-please to propose a further release pull request for —
# the ordinary state right after merging one — is not a failure: `steps.release.outputs.pr` is
# simply empty. GitHub Actions template-compiles a step's `env:` expressions before checking that
# step's `if:`, so a `fromJSON()` call over that empty string in an `env:` block fails the whole
# job regardless of the gate, even though the job's actual release-creation work already
# succeeded (issue #114, BUILD-066). The JSON `steps.release.outputs.pr` carries is therefore only
# ever parsed inside a step's `run:` script below, never in a step's `env:`.
#
# `backfill_tag` (BUILD-067) lets a maintainer re-run build-and-attach's own steps by hand against
# a tag whose GitHub Release already exists but is missing its signed APK — the situation issue
# #114 left the v0.2.0 release in — without release-please needing to have just created that
# release in this same run.
#
# Both build-and-attach and backfill-release-apk check out `main` a second time, to its own path,
# and run the release-signature gate from that checkout rather than from the tag/commit being
# built (BUILD-068, docs/spec/signing.md SIGN-063). The APK is still built from the exact tagged
# commit, but a tag's own tree otherwise carries whatever copy of verify_release_signature.py
# existed when it was cut — never a later fix to the gate itself. Issue #125: after #122/#123's
# real apksigner-parsing fix landed on main, re-running the backfill_tag dispatch against v0.2.0,
# v0.2.1 and v0.2.2 still failed identically, because each of those tags predates the fix and each
# backfill run re-executed its own tag's already-superseded copy of the script.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      backfill_tag:
        description: >-
          Existing release tag (e.g. v0.2.0) whose GitHub Release exists but is missing its
          signed APK. Leave empty for an ordinary run. When set, only the backfill-release-apk
          job below runs, against this tag; release-please and build-and-attach are both skipped.
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    # Skipped during a manual backfill dispatch (`backfill_tag` set): that path never needs
    # release-please to run at all, since it targets a release that already exists.
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.backfill_tag != '') }}
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Pinned to a SHA, not a tag: a tag can move, and this runs with this
      # repository's token. The trailing comment records the version.
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          config-file: .github/release-please/config.json
          manifest-file: .github/release-please/manifest.json

      # `outputs.pr` is set only when the step above opened or updated the release pull
      # request; a push whose commits don't warrant a release pull request leaves it unset,
      # and the two steps below are skipped (BUILD-015).
      - name: Check out the release pull request
        if: ${{ steps.release.outputs.pr }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          fetch-depth: 0

      # VERSION_CODE always advances from what the base branch last released, not from
      # whatever this pull request's branch already carries, so a workflow re-run that finds
      # it already at the right value is a no-op rather than a second bump — see
      # bump_version_code.py and BUILD-015.
      - name: Bump VERSION_CODE on the release pull request
        if: ${{ steps.release.outputs.pr }}
        env:
          # The raw JSON string, never run through fromJSON here — see this workflow's header
          # comment and BUILD-066. This `env:` is a plain string substitution, evaluated the same
          # way whether or not `steps.release.outputs.pr` happens to be empty, so it can never
          # fail template compilation the way parsing JSON in `env:` does.
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          BASE_REF=$(jq -r '.baseBranchName' <<<"${PR_JSON}")
          HEAD_REF=$(jq -r '.headBranchName' <<<"${PR_JSON}")
          git fetch origin "${BASE_REF}"
          git show "origin/${BASE_REF}:gradle.properties" > /tmp/base-gradle.properties
          python3 .github/scripts/bump_version_code.py /tmp/base-gradle.properties gradle.properties
          if git diff --quiet; then
            echo "No VERSION_CODE change to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): bump VERSION_CODE"
          git push origin "HEAD:${HEAD_REF}"

  build-and-attach:
    name: build and attach the release APK
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      # The exact commit release-please tagged, with its own version bump already applied — not
      # necessarily the commit that triggered this run (BUILD-053).
      - name: Check out the release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      # The verification gate itself is sourced from `main`, never from the tag above, into a
      # distinct path so it never overlaps the checkout that builds the APK (BUILD-068,
      # docs/spec/signing.md SIGN-063). A tag's own tree carries whatever copy of
      # verify_release_signature.py existed when it was cut; a fix to the gate must still catch a
      # bad signature in an APK built from a tag that predates the fix.
      - name: Check out main for the release-signature gate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          path: verification-gate

      # Provisioned the same way pr.yml provisions them (BUILD-044).
      - name: Set up the JDK
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      # Gradle needs a keystore file, not the base64 secret itself (BUILD-050). The decoded file
      # lives only in the runner's temp directory for this job and is never logged.
      - name: Decode the release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          keystore_path="$RUNNER_TEMP/release.keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore_path"
          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Assemble the release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_ALIAS_PASSWORD: ${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Remove the decoded keystore
        if: always()
        run: rm -f "$ANDROID_KEYSTORE_PATH"

      # Refuses to publish anything not signed by the pinned release certificate (SIGN-052),
      # before any asset reaches the release. Runs the copy of the script checked out from `main`
      # above, not the one the release-tag checkout itself carries (BUILD-068, SIGN-063).
      - name: Verify the release signature
        run: >-
          python3 verification-gate/.github/scripts/verify_release_signature.py
          app/build/outputs/apk/release/*.apk

      # The second half of "may this be published": the signature gate above proves the artifact
      # carries the right identity, this one proves a device will accept the package at all
      # (BUILD-073, issue #127). Sourced from the same `main` checkout and for the same reason
      # (BUILD-068, SIGN-063) — a tag's own tree carries whatever copy of the gate existed when
      # it was cut, never a later fix to the gate itself, which is precisely how #125 went.
      # Needs no Android SDK: it reads the zip directory, the APK Signing Block and the ELF
      # program headers straight out of the file.
      - name: Verify the release package is installable
        run: >-
          python3 verification-gate/.github/scripts/verify_release_package.py
          app/build/outputs/apk/release/*.apk

      # Uses the runner's pre-installed gh CLI rather than a dedicated upload action: nothing a
      # new action would do here that `gh release upload` does not, and every action added is
      # another uses: reference to pin for no gain (BUILD-055).
      - name: Attach the release APK to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            app/build/outputs/apk/release/*.apk \
            --repo "${{ github.repository }}"

  # A manual, dispatch-only path (BUILD-067) that backfills a signed APK onto a tag whose GitHub
  # Release already exists but never got one attached — exactly what issue #114 left v0.2.0 in.
  # It never runs from a push and carries no `needs:` on release-please, so it never depends on
  # this same run having just created a release: `if:` requires `workflow_dispatch` with
  # `backfill_tag` set, which is a context only a maintainer triggering this workflow by hand (or
  # `workflow_dispatch` via the API) can provide — never anything a `pull_request` could reach,
  # so this does not weaken SIGN-062's invariant.
  backfill-release-apk:
    name: backfill the release APK onto an existing tag (manual)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill_tag != '' }}
    runs-on: ubuntu-latest
    steps:
      # The tag named by the `backfill_tag` input, not a branch or the commit that triggered this
      # dispatch: it must be the exact commit the existing GitHub Release already points at.
      - name: Check out the tag to backfill
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.backfill_tag }}

      # The verification gate itself is sourced from `main`, never from the backfilled tag above,
      # into a distinct path (BUILD-068, docs/spec/signing.md SIGN-063). Issue #125: every one of
      # the v0.2.0/v0.2.1/v0.2.2 backfill dispatches re-ran its own tag's already-superseded copy
      # of verify_release_signature.py and failed identically even after #122/#123's real parser
      # fix landed on `main` — the entire reason this job exists is to recover a release older
      # than the current gate, so the gate it runs must always be the current one.
      - name: Check out main for the release-signature gate
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          path: verification-gate

      # Provisioned the same way build-and-attach provisions them (BUILD-044, BUILD-054).
      - name: Set up the JDK
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      # Gradle needs a keystore file, not the base64 secret itself (BUILD-050). The decoded file
      # lives only in the runner's temp directory for this job and is never logged.
      - name: Decode the release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          keystore_path="$RUNNER_TEMP/release.keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore_path"
          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Assemble the release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_ALIAS_PASSWORD: ${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Remove the decoded keystore
        if: always()
        run: rm -f "$ANDROID_KEYSTORE_PATH"

      # Refuses to publish anything not signed by the pinned release certificate (SIGN-052),
      # before any asset reaches the release. Runs the copy of the script checked out from `main`
      # above, not the one the backfilled tag's own checkout carries (BUILD-068, SIGN-063).
      - name: Verify the release signature
        run: >-
          python3 verification-gate/.github/scripts/verify_release_signature.py
          app/build/outputs/apk/release/*.apk

      # The second half of "may this be published": the signature gate above proves the artifact
      # carries the right identity, this one proves a device will accept the package at all
      # (BUILD-073, issue #127). Sourced from the same `main` checkout and for the same reason
      # (BUILD-068, SIGN-063) — a tag's own tree carries whatever copy of the gate existed when
      # it was cut, never a later fix to the gate itself, which is precisely how #125 went.
      # Needs no Android SDK: it reads the zip directory, the APK Signing Block and the ELF
      # program headers straight out of the file.
      - name: Verify the release package is installable
        run: >-
          python3 verification-gate/.github/scripts/verify_release_package.py
          app/build/outputs/apk/release/*.apk

      # Uses the runner's pre-installed gh CLI, the same as build-and-attach (BUILD-055).
      - name: Attach the release APK to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.backfill_tag }}" \
            app/build/outputs/apk/release/*.apk \
            --repo "${{ github.repository }}"
