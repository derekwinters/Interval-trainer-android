name: pr

# The build gate for a pull request: the unit tests must pass and the app must assemble. This is
# also where the Android build is verified at all — the Android SDK and the Android Gradle Plugin
# come from Google's servers, which not every development environment can reach.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: test and assembleDebug
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # The JDK and the Android SDK are provisioned here rather than assumed from the runner
      # image, so what the build compiles against is decided by this file.
      - name: Set up the JDK
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      # Also validates the checksum of the committed gradle-wrapper.jar.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      # The release gates decide whether a release APK may be published, so they are proven
      # before anything trusts them: verify_release_signature.py for the artifact's identity and
      # verify_release_package.py for whether the package itself is well-formed (BUILD-073). Pure
      # Python and standard library only: no Android SDK, no keystore, no APK, and no action to
      # pin (SIGN-060, SIGN-061). `discover` picks up both suites, so a new gate's tests run here
      # without this step changing.
      - name: Run the release-signature gate's unit tests
        run: python3 -m unittest discover -s .github/scripts/tests -v

      # DS-092 / BUILD-023: caches the real Maven-layout local repository Robolectric's own
      # default resolver (MavenDependencyResolver) downloads the android-all(-instrumented) jar
      # into — `~/.m2/repository`, its own hard-coded default — rather than leaving `./gradlew
      # test` to download it live on every run. Keyed on designsystem/build.gradle.kts, so pinning
      # a different Robolectric version there invalidates this cache instead of silently reusing a
      # jar for the wrong version. See designsystem/build.gradle.kts for why
      # `robolectric.dependency.dir` / `robolectric.offline` are not used for this.
      - name: Restore the Robolectric Maven-repository cache
        id: robolectric-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository
          key: robolectric-m2-android-all-${{ hashFiles('designsystem/build.gradle.kts') }}

      # The one step allowed to reach the network for this jar, and only on a cache miss: run with
      # Robolectric's ordinary defaults (no special properties — see designsystem/build.gradle.kts)
      # so its own MavenDependencyResolver downloads the jar from Maven Central straight into
      # ~/.m2/repository itself, which "Restore the Robolectric Maven-repository cache" above then
      # persists.
      - name: Pre-fetch the Robolectric android-all jar
        if: steps.robolectric-cache.outputs.cache-hit != 'true'
        run: >-
          ./gradlew :designsystem:testDebugUnitTest
          --tests "com.derekwinters.intervaltrainer.designsystem.DesignSystemConsistencyTest"
          --stacktrace

      # A deliberately unreachable repository URL, not robolectric.offline (see
      # designsystem/build.gradle.kts: offline mode on its own does not read the Maven cache at
      # all). MavenDependencyResolver only opens a connection to this URL for an artifact it
      # cannot already find in ~/.m2/repository, so a warm cache never reaches it and a cold one
      # fails loudly here instead of silently reaching the real Maven Central.
      - name: Run the unit tests
        env:
          ROBOLECTRIC_DEPENDENCY_REPO_URL: https://robolectric-cache-miss.invalid/maven2
        run: ./gradlew test --stacktrace

      # BUILD-046: every pull request keeps the schema Room actually exported, so a schema change
      # can be reviewed against the committed database/schemas/ file (SCHEMA-003) without anyone
      # reproducing an Android build locally — which, per CLAUDE.md, most environments working on
      # this repository cannot do at all, because Room resolves only from Google's Maven.
      #
      # It runs here, straight after the unit tests, rather than at the end of the job, because
      # `./gradlew test` alone already reaches :database's Room KSP tasks and its `copyRoomSchemas`
      # task — observed in a real run, not assumed — so database/schemas/ is populated by this
      # point. `if: always()` so a later failure still leaves the exported schema to look at.
      #
      # The path is database/schemas/ only: that is the consolidated, committed location, one file
      # per database class. The per-task raw exports under build/intermediates/room/schemas/ are
      # the same content before `copyRoomSchemas` collects it, and are not worth uploading twice.
      #
      # Adds no permission: BUILD-042's `contents: read` is all an artifact upload needs. The SHA
      # is the one release-candidate.yml already pins for this action (BUILD-043).
      - name: Upload the exported Room schemas
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: room-schemas
          path: database/schemas/
          if-no-files-found: warn
          retention-days: 3

      - name: Assemble the debug APK
        run: ./gradlew assembleDebug
