name: pr

# The build gate for a pull request: the unit tests must pass and the app must assemble. This is
# also where the Android build is verified at all — the Android SDK and the Android Gradle Plugin
# come from Google's servers, which not every development environment can reach.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: test and assembleDebug
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # The JDK and the Android SDK are provisioned here rather than assumed from the runner
      # image, so what the build compiles against is decided by this file.
      - name: Set up the JDK
        uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5.4.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      # Also validates the checksum of the committed gradle-wrapper.jar.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      # The release-signature gate decides whether a release APK may be published, so it is
      # proven before anything trusts it. Pure Python and standard library only: no Android SDK,
      # no keystore, no APK, and no action to pin (SIGN-060, SIGN-061).
      - name: Run the release-signature gate's unit tests
        run: python3 -m unittest discover -s .github/scripts/tests -v

      # DS-092 / BUILD-023: caches Robolectric's android-all jar rather than leaving `./gradlew
      # test` to download it live on every run. Keyed on designsystem/build.gradle.kts, so pinning
      # a different Robolectric version there invalidates this cache instead of silently reusing a
      # stale jar.
      - name: Restore the Robolectric android-all jar cache
        id: robolectric-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/robolectric
          key: robolectric-android-all-${{ hashFiles('designsystem/build.gradle.kts') }}

      # The one step allowed to reach the network for this jar, and only on a cache miss: it
      # resolves the jar into the directory `robolectric.dependency.dir` reads
      # (`ROBOLECTRIC_DEPENDENCY_DIR`), so "Run the unit tests" below finds it already there and
      # never touches the network for it itself.
      - name: Pre-fetch the Robolectric android-all jar
        if: steps.robolectric-cache.outputs.cache-hit != 'true'
        env:
          ROBOLECTRIC_DEPENDENCY_DIR: /home/runner/.cache/robolectric
        run: >-
          ./gradlew :designsystem:testDebugUnitTest
          --tests "com.derekwinters.intervaltrainer.designsystem.DesignSystemConsistencyTest"

      - name: Run the unit tests
        env:
          ROBOLECTRIC_DEPENDENCY_DIR: /home/runner/.cache/robolectric
          ROBOLECTRIC_OFFLINE: 'true'
        run: ./gradlew test

      - name: Assemble the debug APK
        run: ./gradlew assembleDebug
