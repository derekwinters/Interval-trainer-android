org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# The app's version, read by :app's build.gradle.kts (BUILD-013). VERSION_NAME
# is rewritten in place by release-please's generic updater on every release
# pull request; the trailing comment is the marker it looks for and is not
# part of the version string itself. VERSION_CODE carries no such marker —
# release-please's generic updater only substitutes semver components, never a
# freestanding counter — so the "Bump VERSION_CODE" step in
# release-please.yml increments it on every release pull request instead
# (BUILD-015).
VERSION_NAME=0.2.1 # x-release-please-version
VERSION_CODE=3
