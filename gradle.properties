org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# The app's version, read by :app's build.gradle.kts (BUILD-013). VERSION_NAME
# is rewritten in place by release-please's generic updater on every release
# pull request; the trailing comment is the marker it looks for and is not
# part of the version string itself. VERSION_CODE's bump mechanism is #12.
VERSION_NAME=0.1.0 # x-release-please-version
VERSION_CODE=1
