<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap');
  * { box-sizing: border-box; }
  body { margin: 0; }
  a { color: #57c98a; }
  a:hover { color: #7edda6; }
  .screen {
    --bg: #0a0d10;
    --fg: #f5f7f9;
    --dim: rgba(245,247,249,.62);
    --faint: rgba(245,247,249,.36);
    --work: #57c98a;
    --line: rgba(255,255,255,.09);
    --chip: rgba(255,255,255,.05);
    width: 390px; height: 844px; position: relative; overflow: hidden;
    background: var(--bg); color: var(--fg);
    font-family: 'Manrope', ui-sans-serif, system-ui, sans-serif;
    display: flex; flex-direction: column;
    padding: 30px 24px 34px;
  }
  .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
  .row { display: flex; align-items: center; }
  .top { justify-content: space-between; }
  .stat-label { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); font-weight: 700; }
  .stat-value { font-size: 13px; color: var(--dim); font-weight: 600; margin-top: 2px; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--chip); border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    color: var(--dim);
  }
  .ring-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; }
  .ring-stack { position: relative; width: 264px; height: 264px; display: flex; align-items: center; justify-content: center; }
  .ring-stack svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .ring-center { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .kind-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--work); display: inline-block; margin-right: 6px; }
  .kind-label { font-size: 13px; letter-spacing: .10em; text-transform: uppercase; font-weight: 800; color: var(--work); display: flex; align-items: center; }
  .time { font-size: 74px; font-weight: 600; line-height: 1; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
  .of-total { font-size: 13px; color: var(--faint); font-weight: 500; }
  .total-left { font-size: 13px; color: var(--dim); }
  .total-left b { color: var(--fg); font-weight: 700; }
  .next-chip {
    display: flex; align-items: center; gap: 8px;
    background: var(--chip); border: 1px solid var(--line);
    border-radius: 999px; padding: 8px 16px 8px 14px;
    margin: 0 auto;
  }
  .next-chip .label { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); font-weight: 700; }
  .next-chip .value { font-size: 13px; color: var(--dim); font-weight: 600; }
  .controls { display: flex; align-items: center; justify-content: center; gap: 26px; margin-top: 26px; }
  .primary-btn {
    width: 78px; height: 78px; border-radius: 50%;
    background: var(--work); color: #06170f;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 26px rgba(87,201,138,.32);
    border: none;
  }
  .secondary-btn {
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--chip); border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    color: var(--dim);
  }
</style>
</helmet>
<div class="screen">
  <div class="row top">
    <div>
      <div class="stat-label">Round</div>
      <div class="stat-value">2 of 4</div>
    </div>
    <div class="icon-btn" aria-label="Unmuted">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9.5v5h3.2L12 18.3V5.7L7.2 9.5H4Z" fill="currentColor" stroke="none"/>
        <path d="M15.8 8.7a4.6 4.6 0 0 1 0 6.6"/>
        <path d="M18.3 6.2a8.2 8.2 0 0 1 0 11.6"/>
      </svg>
    </div>
  </div>

  <div class="ring-wrap">
    <div class="ring-stack">
      <svg viewBox="0 0 280 280">
        <circle cx="140" cy="140" r="120" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="14"/>
        <circle cx="140" cy="140" r="120" fill="none" stroke="#57c98a" stroke-width="14" stroke-linecap="round"
          stroke-dasharray="754" stroke-dashoffset="220"/>
      </svg>
      <div class="ring-center">
        <div class="kind-label"><span class="kind-dot"></span>Work</div>
        <div class="time mono">0:32</div>
        <div class="of-total">of 0:45</div>
      </div>
    </div>
    <div class="total-left">Total left&nbsp; <b>12:40</b></div>
    <div class="next-chip">
      <span class="label">Next</span>
      <span class="value">Recovery · 1:30</span>
    </div>
  </div>

  <div class="controls">
    <div class="secondary-btn" aria-label="Skip">
      <svg width="20" height="20" viewBox="0 0 24 24"><path d="M5 5.6v12.8a.9.9 0 0 0 1.38.76L16 13.2a.9.9 0 0 0 0-1.52L6.38 4.84A.9.9 0 0 0 5 5.6Z" fill="currentColor"/><rect x="17" y="5" width="2.4" height="14" rx="1" fill="currentColor"/></svg>
    </div>
    <div class="primary-btn" aria-label="Pause">
      <svg width="30" height="30" viewBox="0 0 24 24"><rect x="6" y="5" width="4.6" height="14" rx="1.2" fill="currentColor"/><rect x="13.4" y="5" width="4.6" height="14" rx="1.2" fill="currentColor"/></svg>
    </div>
    <div class="secondary-btn" aria-label="Stop">
      <svg width="18" height="18" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="3" fill="currentColor"/></svg>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
