<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap');
  * { box-sizing: border-box; }
  body { margin: 0; }
  a { color: #eafff2; }
  a:hover { color: #ffffff; }
  .screen {
    --work: #1f4a30;
    --work-bright: #79e0a4;
    --fg: #f2fbf5;
    --dim: rgba(242,251,245,.72);
    --faint: rgba(242,251,245,.44);
    --chip: rgba(0,0,0,.22);
    --line: rgba(255,255,255,.16);
    width: 390px; height: 844px; position: relative; overflow: hidden;
    background: radial-gradient(120% 90% at 50% -6%, #2a5c3b 0%, #16311f 46%, #0f2418 100%);
    color: var(--fg);
    font-family: 'Manrope', ui-sans-serif, system-ui, sans-serif;
    display: flex; flex-direction: column;
    padding: 30px 24px 34px;
  }
  .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
  .row { display: flex; align-items: center; }
  .top { justify-content: space-between; }
  .stat-label { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); font-weight: 700; }
  .stat-value { font-size: 13px; color: var(--dim); font-weight: 700; margin-top: 2px; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--chip); border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    color: var(--dim);
  }
  .center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  .kind-label { font-size: 15px; letter-spacing: .16em; text-transform: uppercase; font-weight: 800; color: var(--work-bright); }
  .time { font-size: 100px; font-weight: 700; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .of-total { font-size: 14px; color: var(--faint); font-weight: 500; }
  .total-left { font-size: 13px; color: var(--dim); margin-top: 8px; }
  .total-left b { color: var(--fg); font-weight: 700; }
  .next-strip {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--chip); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    padding: 10px 0; margin: 0 -24px 22px;
  }
  .next-strip .label { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); font-weight: 700; }
  .next-strip .value { font-size: 13px; color: var(--dim); font-weight: 600; }
  .controls { display: flex; align-items: center; justify-content: center; gap: 26px; }
  .primary-btn {
    width: 78px; height: 78px; border-radius: 50%;
    background: #f2fbf5; color: #123420;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 26px rgba(0,0,0,.28);
    border: none;
  }
  .secondary-btn {
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--chip); border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    color: var(--dim);
  }
</style>
</helmet>
<div class="screen">
  <div class="row top">
    <div>
      <div class="stat-label">Round</div>
      <div class="stat-value">2 of 4</div>
    </div>
    <div class="icon-btn" aria-label="Unmuted">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9.5v5h3.2L12 18.3V5.7L7.2 9.5H4Z" fill="currentColor" stroke="none"/>
        <path d="M15.8 8.7a4.6 4.6 0 0 1 0 6.6"/>
        <path d="M18.3 6.2a8.2 8.2 0 0 1 0 11.6"/>
      </svg>
    </div>
  </div>

  <div class="center">
    <div class="kind-label">Work</div>
    <div class="time mono">0:32</div>
    <div class="of-total">of 0:45 &nbsp;·&nbsp; 12:40 total left</div>
  </div>

  <div class="next-strip">
    <span class="label">Next</span>
    <span class="value">Recovery · 1:30</span>
  </div>

  <div class="controls">
    <div class="secondary-btn" aria-label="Skip">
      <svg width="20" height="20" viewBox="0 0 24 24"><path d="M5 5.6v12.8a.9.9 0 0 0 1.38.76L16 13.2a.9.9 0 0 0 0-1.52L6.38 4.84A.9.9 0 0 0 5 5.6Z" fill="currentColor"/><rect x="17" y="5" width="2.4" height="14" rx="1" fill="currentColor"/></svg>
    </div>
    <div class="primary-btn" aria-label="Pause">
      <svg width="30" height="30" viewBox="0 0 24 24"><rect x="6" y="5" width="4.6" height="14" rx="1.2" fill="currentColor"/><rect x="13.4" y="5" width="4.6" height="14" rx="1.2" fill="currentColor"/></svg>
    </div>
    <div class="secondary-btn" aria-label="Stop">
      <svg width="18" height="18" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="3" fill="currentColor"/></svg>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
