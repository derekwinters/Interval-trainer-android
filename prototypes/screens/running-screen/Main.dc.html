<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap');
  * { box-sizing: border-box; }
  body { margin: 0; }
  a { color: #57c98a; }
  a:hover { color: #7edda6; }
  .screen {
    --bg: #0a0d10;
    --fg: #f5f7f9;
    --dim: rgba(245,247,249,.62);
    --faint: rgba(245,247,249,.36);
    --work: #57c98a;
    --recovery: #f0c65a;
    --neutral: #7c93ab;
    --line: rgba(255,255,255,.09);
    --chip: rgba(255,255,255,.05);
    width: 390px; height: 844px; position: relative; overflow: hidden;
    background: var(--bg); color: var(--fg);
    font-family: 'Manrope', ui-sans-serif, system-ui, sans-serif;
    display: flex; flex-direction: column;
    padding: 28px 22px 30px;
  }
  .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
  .row { display: flex; align-items: center; }
  .top { justify-content: space-between; margin-bottom: 6px; }
  .stat-label { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); font-weight: 700; }
  .stat-value { font-size: 13px; color: var(--dim); font-weight: 600; margin-top: 2px; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 50%;
    background: var(--chip); border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    color: var(--dim);
  }
  .body { display: flex; gap: 8px; height: 552px; }
  .ring-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; min-width: 0; }
  .ring-stack { position: relative; width: 216px; height: 216px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .ring-stack svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .ring-center { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .kind-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--work); display: inline-block; margin-right: 5px; }
  .kind-label { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; font-weight: 800; color: var(--work); display: flex; align-items: center; }
  .time { font-size: 50px; font-weight: 600; line-height: 1; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
  .of-total { font-size: 11px; color: var(--faint); font-weight: 500; }
  .total-left { font-size: 11px; color: var(--dim); }
  .total-left b { color: var(--fg); font-weight: 700; }

  /* --- rolodex rail: option A, flat cards on a spindle (narrow) --- */
  .rail-col { flex: 0 0 94px; position: relative; display: flex; align-items: center; }
  .spindle { position: absolute; left: 2px; top: 4%; bottom: 4%; width: 2px; border-radius: 1px;
    background: linear-gradient(to bottom, transparent, rgba(255,255,255,.16) 18%, rgba(255,255,255,.16) 82%, transparent); }
  .rail { position: relative; width: 100%; display: flex; flex-direction: column; justify-content: center; gap: 5px; padding-left: 7px; }
  .r { display: flex; align-items: center; gap: 5px; border-radius: 8px; padding: 4px 5px; }
  .r .bar { width: 3px; align-self: stretch; border-radius: 2px; flex-shrink: 0; }
  .r .bar.work { background: var(--work); } .r .bar.recovery { background: var(--recovery); } .r .bar.neutral { background: var(--neutral); }
  .r .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .r .du { margin-left: auto; font-variant-numeric: tabular-nums; white-space: nowrap; flex-shrink: 0; }
  .d0 { font-size: 11.5px; color: var(--fg); background: rgba(87,201,138,.14); border: 1px solid rgba(87,201,138,.35); }
  .d0 .nm { font-size: 10.5px; }
  .d0 .du { font-weight: 700; }
  .d1 { font-size: 9.5px; color: rgba(245,247,249,.72); }
  .d1 .du { font-size: 8.5px; }
  .d2 { font-size: 8.5px; color: rgba(245,247,249,.48); }
  .d2 .du { display: none; }
  .d3 { font-size: 7.5px; color: rgba(245,247,249,.28); }
  .d3 .du { display: none; }

  .controls { display: flex; align-items: center; justify-content: center; gap: 24px; margin-top: 12px; }
  .primary-btn { width: 74px; height: 74px; border-radius: 50%; background: var(--work); color: #06170f;
    display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px rgba(87,201,138,.30); border: none; }
  .secondary-btn { width: 50px; height: 50px; border-radius: 50%; background: var(--chip); border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center; color: var(--dim); }
</style>
</helmet>
<div class="screen">
  <div class="row top">
    <div>
      <div class="stat-label">Round</div>
      <div class="stat-value">2 of 4</div>
    </div>
    <div class="icon-btn" aria-label="Unmuted">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9.5v5h3.2L12 18.3V5.7L7.2 9.5H4Z" fill="currentColor" stroke="none"/>
        <path d="M15.8 8.7a4.6 4.6 0 0 1 0 6.6"/>
        <path d="M18.3 6.2a8.2 8.2 0 0 1 0 11.6"/>
      </svg>
    </div>
  </div>

  <div class="body">
    <div class="ring-col">
      <div class="ring-stack">
        <svg viewBox="0 0 200 200">
          <circle cx="100" cy="100" r="82" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="11"/>
          <circle cx="100" cy="100" r="82" fill="none" stroke="#57c98a" stroke-width="11" stroke-linecap="round" stroke-dasharray="515" stroke-dashoffset="150"/>
        </svg>
        <div class="ring-center">
          <div class="kind-label"><span class="kind-dot"></span>Work</div>
          <div class="time mono">0:32</div>
          <div class="of-total">of 0:45</div>
        </div>
      </div>
      <div class="total-left">Total left&nbsp; <b>10:02</b></div>
    </div>

    <div class="rail-col">
      <div class="spindle"></div>
      <div class="rail">
        <div class="r d3"><span class="bar neutral"></span><span class="nm">Warm‑up</span><span class="du">3:00</span></div>
        <div class="r d2"><span class="bar work"></span><span class="nm">Work</span><span class="du">0:45</span></div>
        <div class="r d1"><span class="bar recovery"></span><span class="nm">Recovery</span><span class="du">1:30</span></div>
        <div class="r d0"><span class="bar work"></span><span class="nm">Work</span><span class="du">0:32</span></div>
        <div class="r d1"><span class="bar recovery"></span><span class="nm">Recovery</span><span class="du">1:15</span></div>
        <div class="r d2"><span class="bar work"></span><span class="nm">Work</span><span class="du">1:00</span></div>
        <div class="r d3"><span class="bar recovery"></span><span class="nm">Recovery</span><span class="du">1:15</span></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="secondary-btn" aria-label="Skip">
      <svg width="20" height="20" viewBox="0 0 24 24"><path d="M5 5.6v12.8a.9.9 0 0 0 1.38.76L16 13.2a.9.9 0 0 0 0-1.52L6.38 4.84A.9.9 0 0 0 5 5.6Z" fill="currentColor"/><rect x="17" y="5" width="2.4" height="14" rx="1" fill="currentColor"/></svg>
    </div>
    <div class="primary-btn" aria-label="Pause">
      <svg width="28" height="28" viewBox="0 0 24 24"><rect x="6" y="5" width="4.6" height="14" rx="1.2" fill="currentColor"/><rect x="13.4" y="5" width="4.6" height="14" rx="1.2" fill="currentColor"/></svg>
    </div>
    <div class="secondary-btn" aria-label="Stop">
      <svg width="18" height="18" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="3" fill="currentColor"/></svg>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
