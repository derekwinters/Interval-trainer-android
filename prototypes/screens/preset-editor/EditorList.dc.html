<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap');
  * { box-sizing: border-box; }
  body { margin: 0; }
  a { color: #57c98a; }
  a:hover { color: #7edda6; }
  .screen {
    --bg: #0a0d10; --fg: #f5f7f9; --dim: rgba(245,247,249,.62); --faint: rgba(245,247,249,.36);
    --work: #57c98a; --recovery: #f0c65a; --neutral: #7c93ab;
    --line: rgba(255,255,255,.09); --chip: rgba(255,255,255,.05); --card: rgba(255,255,255,.03);
    width: 390px; height: 844px; position: relative; overflow: hidden;
    background: var(--bg); color: var(--fg);
    font-family: 'Manrope', ui-sans-serif, system-ui, sans-serif;
    display: flex; flex-direction: column;
    padding: 26px 20px 22px;
  }
  .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
  .top { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .back { width: 34px; height: 34px; border-radius: 50%; background: var(--chip); border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center; color: var(--dim); flex-shrink: 0; }
  .h1 { font-size: 18px; font-weight: 800; flex: 1; }
  .save { background: var(--work); color: #06170f; border-radius: 999px; padding: 8px 16px; font-size: 13px; font-weight: 800; }

  .field-lbl { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); font-weight: 700; margin-bottom: 6px; }
  .name-field { height: 42px; border-radius: 11px; background: var(--card); border: 1px solid var(--line);
    display: flex; align-items: center; padding: 0 13px; font-size: 14px; font-weight: 700; gap: 3px; margin-bottom: 14px; }
  .caret { width: 1.5px; height: 16px; background: var(--work); }

  .list-lbl { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
  .list-lbl .field-lbl { margin-bottom: 0; }
  .list-lbl .hint2 { font-size: 10px; color: var(--faint); }

  .lrow { display: flex; align-items: center; gap: 7px; height: 38px; border-bottom: 1px solid var(--line); }
  .grip { color: rgba(245,247,249,.22); flex-shrink: 0; display: flex; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot.work { background: var(--work); } .dot.recovery { background: var(--recovery); } .dot.neutral { background: var(--neutral); }
  .lnm { flex: 1; font-size: 13px; font-weight: 700; }
  .ldu { font-size: 12.5px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .ldel { color: rgba(245,247,249,.24); flex-shrink: 0; display: flex; }

  .lrow.dragging { background: rgba(255,255,255,.045); border-radius: 9px; border-bottom-color: transparent;
    box-shadow: 0 8px 18px rgba(0,0,0,.35); transform: scale(1.015) rotate(-0.4deg); }
  .lrow.dragging .grip { color: var(--work); }
  .drop-line { height: 0; border-top: 1.5px dashed rgba(87,201,138,.5); margin: 3px 0; }

  .lrow.active { flex-direction: column; align-items: stretch; height: auto; padding: 9px 0 11px; gap: 2px; }
  .active-head { display: flex; align-items: center; gap: 7px; height: 24px; }
  .active-head .lnm { flex: 1; }
  .chev { color: var(--faint); flex-shrink: 0; }

  .picker-mini { position: relative; display: flex; align-items: center; justify-content: center; padding: 6px 0 2px; }
  .pm-band { position: absolute; left: 30px; right: 30px; top: 50%; transform: translateY(-50%); height: 26px;
    background: rgba(87,201,138,.10); border-top: 1px solid rgba(87,201,138,.35); border-bottom: 1px solid rgba(87,201,138,.35); }
  .pm-cols { position: relative; display: flex; align-items: center; gap: 4px; }
  .pm-col { display: flex; flex-direction: column; align-items: center; width: 54px; }
  .pm-r { height: 26px; display: flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; font-weight: 700; }
  .pm-p0 { font-size: 17px; color: var(--fg); opacity: 1; }
  .pm-p1 { font-size: 13px; color: var(--dim); opacity: .5; }
  .pm-colon { font-size: 15px; font-weight: 700; color: var(--faint); }
  .pm-units { display: flex; gap: 52px; margin-top: 2px; }
  .pm-unit { font-size: 8.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); font-weight: 700; width: 54px; text-align: center; }

  .add-row { display: flex; gap: 8px; margin-top: 12px; }
  .add-btn { flex: 1; height: 40px; border-radius: 11px; background: var(--chip); border: 1px dashed var(--line);
    display: flex; align-items: center; justify-content: center; gap: 6px; color: var(--dim); font-size: 12.5px; font-weight: 700; }

  .total { text-align: center; font-size: 12px; color: var(--faint); margin-top: auto; padding-top: 12px; }
  .total b { color: var(--dim); font-weight: 700; }
</style>
</helmet>
<div class="screen">
  <div class="top">
    <div class="back"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></div>
    <div class="h1">Edit preset</div>
    <div class="save">Save</div>
  </div>

  <div class="field-lbl">Name</div>
  <div class="name-field">Easy run/walk<span class="caret"></span></div>

  <div class="list-lbl">
    <div class="field-lbl">Schedule</div>
    <div class="hint2">Drag ⋮⋮ to reorder · tap a duration to edit</div>
  </div>

  <div class="lrow">
    <span class="grip">⠿</span><span class="dot neutral"></span><span class="lnm">Warm-up</span>
    <span class="ldu mono">3:00</span><span class="ldel">✕</span>
  </div>
  <div class="lrow">
    <span class="grip">⠿</span><span class="dot work"></span><span class="lnm">Work</span>
    <span class="ldu mono">0:45</span><span class="ldel">✕</span>
  </div>

  <div class="lrow dragging">
    <span class="grip">⠿</span><span class="dot recovery"></span><span class="lnm">Recovery</span>
    <span class="ldu mono">1:30</span><span class="ldel">✕</span>
  </div>
  <div class="drop-line"></div>

  <div class="lrow">
    <span class="grip">⠿</span><span class="dot work"></span><span class="lnm">Work</span>
    <span class="ldu mono">0:45</span><span class="ldel">✕</span>
  </div>
  <div class="lrow">
    <span class="grip">⠿</span><span class="dot recovery"></span><span class="lnm">Recovery</span>
    <span class="ldu mono">1:15</span><span class="ldel">✕</span>
  </div>

  <div class="lrow active">
    <div class="active-head">
      <span class="grip">⠿</span><span class="dot work"></span><span class="lnm">Work</span>
      <span class="chev">▾</span><span class="ldel">✕</span>
    </div>
    <div class="picker-mini">
      <div class="pm-band"></div>
      <div class="pm-cols">
        <div class="pm-col">
          <div class="pm-r pm-p1 mono">00</div>
          <div class="pm-r pm-p0 mono">01</div>
          <div class="pm-r pm-p1 mono">02</div>
        </div>
        <div class="pm-colon">:</div>
        <div class="pm-col">
          <div class="pm-r pm-p1 mono">55</div>
          <div class="pm-r pm-p0 mono">00</div>
          <div class="pm-r pm-p1 mono">05</div>
        </div>
      </div>
    </div>
    <div class="pm-units"><span class="pm-unit">min</span><span class="pm-unit">sec</span></div>
  </div>

  <div class="lrow">
    <span class="grip">⠿</span><span class="dot recovery"></span><span class="lnm">Recovery</span>
    <span class="ldu mono">1:15</span><span class="ldel">✕</span>
  </div>
  <div class="lrow">
    <span class="grip">⠿</span><span class="dot work"></span><span class="lnm">Work</span>
    <span class="ldu mono">1:00</span><span class="ldel">✕</span>
  </div>
  <div class="lrow">
    <span class="grip">⠿</span><span class="dot neutral"></span><span class="lnm">Cool-down</span>
    <span class="ldu mono">5:00</span><span class="ldel">✕</span>
  </div>

  <div class="add-row">
    <div class="add-btn">+ Interval</div>
    <div class="add-btn">+ Rounds…</div>
  </div>

  <div class="total">9 intervals &nbsp;·&nbsp; total <b>15:30</b></div>
</div>
</x-dc>
</body>
</html>
